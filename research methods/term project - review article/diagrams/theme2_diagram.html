<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Theme 2 Diagram</title>
<style>
  body { font-family: sans-serif; background: #fff; margin: 0; padding: 16px; }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1a1a; }
  }
</style>
</head>
<body>
<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="340" y="22" text-anchor="middle" font-size="13" font-weight="500" fill="#1a1a1a">Theme 2 — transformer studies: accuracy, XAI, and adversarial risk</text>

<!-- Four study boxes top row -->
<rect x="20" y="36" width="145" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="92" y="55" text-anchor="middle" font-size="11" font-weight="500" fill="#04342C">Mitrovic et al. (2023)</text>
<text x="92" y="70" text-anchor="middle" font-size="10" fill="#0F6E56">DistilBERT + SHAP</text>
<text x="92" y="85" text-anchor="middle" font-size="10" fill="#085041">Short review detection</text>

<rect x="178" y="36" width="145" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="250" y="55" text-anchor="middle" font-size="11" font-weight="500" fill="#04342C">Joshi et al. (2024)</text>
<text x="250" y="70" text-anchor="middle" font-size="10" fill="#0F6E56">RoBERTa-Sentinel + LIME</text>
<text x="250" y="85" text-anchor="middle" font-size="10" fill="#085041">HULLMI framework</text>

<rect x="336" y="36" width="145" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="408" y="55" text-anchor="middle" font-size="11" font-weight="500" fill="#04342C">Masih et al. (2025)</text>
<text x="408" y="70" text-anchor="middle" font-size="10" fill="#0F6E56">BERT/RoBERTa + LIME+SHAP</text>
<text x="408" y="85" text-anchor="middle" font-size="10" fill="#085041">LIME vs. SHAP comparison</text>

<rect x="494" y="36" width="166" height="64" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.8"/>
<text x="577" y="55" text-anchor="middle" font-size="11" font-weight="500" fill="#501313">Mohammadi et al. (2025)</text>
<text x="577" y="70" text-anchor="middle" font-size="10" fill="#A32D2D">XAI-informed adversarial attack</text>
<text x="577" y="85" text-anchor="middle" font-size="10" fill="#791F1F">Token replacement exploit</text>

<!-- Accuracy vs interpretability axis -->
<text x="340" y="122" text-anchor="middle" font-size="11" fill="#888">detection accuracy (higher = better)</text>
<line x1="50" y1="134" x2="630" y2="134" stroke="#ccc" stroke-width="0.8"/>
<line x1="50" y1="130" x2="50" y2="138" stroke="#ccc" stroke-width="0.8"/>
<line x1="630" y1="130" x2="630" y2="138" stroke="#ccc" stroke-width="0.8"/>
<text x="50" y="148" text-anchor="middle" font-size="10" fill="#888">lower</text>
<text x="630" y="148" text-anchor="middle" font-size="10" fill="#888">higher</text>

<!-- Accuracy markers -->
<circle cx="130" cy="134" r="6" fill="#1D9E75"/>
<text x="130" y="162" text-anchor="middle" font-size="10" fill="#085041">~84%</text>
<circle cx="280" cy="134" r="6" fill="#1D9E75"/>
<text x="280" y="162" text-anchor="middle" font-size="10" fill="#085041">~91%</text>
<circle cx="430" cy="134" r="6" fill="#1D9E75"/>
<text x="430" y="162" text-anchor="middle" font-size="10" fill="#085041">~89%</text>
<circle cx="560" cy="134" r="6" fill="#E24B4A"/>
<text x="560" y="162" text-anchor="middle" font-size="10" fill="#A32D2D">drops 20–35%</text>
<text x="560" y="174" text-anchor="middle" font-size="10" fill="#A32D2D">under attack</text>

<!-- Key insights row -->
<text x="340" y="198" text-anchor="middle" font-size="11" fill="#888">Key XAI insight per study</text>

<rect x="20" y="206" width="145" height="54" rx="6" fill="#E1F5EE" stroke="#9FE1CB" stroke-width="0.5"/>
<text x="92" y="222" text-anchor="middle" font-size="10" fill="#04342C">Superlatives and</text>
<text x="92" y="236" text-anchor="middle" font-size="10" fill="#04342C">formulaic closings</text>
<text x="92" y="250" text-anchor="middle" font-size="10" fill="#0F6E56">= AI signal in reviews</text>

<rect x="178" y="206" width="145" height="54" rx="6" fill="#E1F5EE" stroke="#9FE1CB" stroke-width="0.5"/>
<text x="250" y="222" text-anchor="middle" font-size="10" fill="#04342C">Explainability does not</text>
<text x="250" y="236" text-anchor="middle" font-size="10" fill="#04342C">reduce accuracy —</text>
<text x="250" y="250" text-anchor="middle" font-size="10" fill="#0F6E56">it complements it</text>

<rect x="336" y="206" width="145" height="54" rx="6" fill="#E1F5EE" stroke="#9FE1CB" stroke-width="0.5"/>
<text x="408" y="222" text-anchor="middle" font-size="10" fill="#04342C">SHAP more stable;</text>
<text x="408" y="236" text-anchor="middle" font-size="10" fill="#04342C">both expose models</text>
<text x="408" y="250" text-anchor="middle" font-size="10" fill="#0F6E56">correct for wrong reasons</text>

<rect x="494" y="206" width="166" height="54" rx="6" fill="#FCEBEB" stroke="#F7C1C1" stroke-width="0.5"/>
<text x="577" y="222" text-anchor="middle" font-size="10" fill="#501313">XAI explanations become</text>
<text x="577" y="236" text-anchor="middle" font-size="10" fill="#501313">the attack vector —</text>
<text x="577" y="250" text-anchor="middle" font-size="10" fill="#A32D2D">the "explainability paradox"</text>

<!-- Warning box -->
<rect x="20" y="276" width="640" height="48" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.8"/>
<text x="340" y="296" text-anchor="middle" font-size="12" font-weight="500" fill="#501313">Critical open problem surfaced by Theme 2</text>
<text x="340" y="313" text-anchor="middle" font-size="11" fill="#791F1F">Adversarially resilient AND interpretable detection systems do not yet exist — the most urgent gap in the field</text>

<!-- Arrows down to insight boxes -->
<line x1="92" y1="100" x2="92" y2="206" stroke="#9FE1CB" stroke-width="0.6" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<line x1="250" y1="100" x2="250" y2="206" stroke="#9FE1CB" stroke-width="0.6" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<line x1="408" y1="100" x2="408" y2="206" stroke="#9FE1CB" stroke-width="0.6" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<line x1="577" y1="100" x2="577" y2="206" stroke="#F09595" stroke-width="0.6" stroke-dasharray="3 2" marker-end="url(#arrow)"/>

<line x1="92" y1="260" x2="92" y2="276" stroke="#ccc" stroke-width="0.6" marker-end="url(#arrow)"/>
<line x1="577" y1="260" x2="577" y2="276" stroke="#F09595" stroke-width="0.6" marker-end="url(#arrow)"/>
</svg>
</body>
</html>

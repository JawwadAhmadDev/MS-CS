<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Research Gaps Roadmap</title>
<style>
  body { font-family: sans-serif; background: #fff; margin: 0; padding: 16px; }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1a1a; }
    .bg { fill: #1a1a1a; }
    .axis-line { stroke: #5F5E5A !important; }
    .axis-label { fill: #9c9a92 !important; }
    .title-text { fill: #e8e6dc !important; }
    .grid { stroke: #2C2C2A !important; }
    .quad-label { fill: #5F5E5A !important; }
    .note { fill: #888780 !important; }
  }
</style>
</head>
<body>
<svg width="100%" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Title -->
<text x="340" y="22" text-anchor="middle" font-size="13" font-weight="500" fill="#1a1a1a" class="title-text">Research gaps — urgency vs. feasibility priority matrix</text>

<!-- Axis bounds: x from 80 to 580, y from 50 to 420 -->
<!-- x-axis = feasibility (low left → high right) -->
<!-- y-axis = urgency (low bottom → high top) -->

<!-- Quadrant fills -->
<rect x="80"  y="50"  width="250" height="185" fill="#FAEEDA" fill-opacity="0.25"/>
<rect x="330" y="50"  width="250" height="185" fill="#EAF3DE" fill-opacity="0.3"/>
<rect x="80"  y="235" width="250" height="185" fill="#FCEBEB" fill-opacity="0.2"/>
<rect x="330" y="235" width="250" height="185" fill="#E1F5EE" fill-opacity="0.25"/>

<!-- Grid lines -->
<line x1="80"  y1="235" x2="580" y2="235" stroke="#ddd" stroke-width="0.5" stroke-dasharray="4 3" class="grid"/>
<line x1="330" y1="50"  x2="330" y2="420" stroke="#ddd" stroke-width="0.5" stroke-dasharray="4 3" class="grid"/>

<!-- Quadrant labels -->
<text x="205" y="72"  text-anchor="middle" font-size="10" fill="#BA7517" class="quad-label">Hard but important</text>
<text x="455" y="72"  text-anchor="middle" font-size="10" fill="#3B6D11" class="quad-label">Priority — do first</text>
<text x="205" y="258" text-anchor="middle" font-size="10" fill="#A32D2D" class="quad-label">Deprioritize</text>
<text x="455" y="258" text-anchor="middle" font-size="10" fill="#0F6E56" class="quad-label">Quick wins</text>

<!-- Axes -->
<line x1="80" y1="420" x2="590" y2="420" stroke="#888" stroke-width="1.2" marker-end="url(#ax)" class="axis-line"/>
<line x1="80" y1="420" x2="80"  y2="40"  stroke="#888" stroke-width="1.2" marker-end="url(#ax)" class="axis-line"/>

<!-- Axis labels -->
<text x="335" y="445" text-anchor="middle" font-size="12" font-weight="500" fill="#444" class="axis-label">Feasibility with current methods →</text>
<text x="28"  y="235" text-anchor="middle" font-size="12" font-weight="500" fill="#444" class="axis-label" transform="rotate(-90 28 235)">Research urgency →</text>

<!-- Axis ticks -->
<text x="80"  y="436" text-anchor="middle" font-size="10" fill="#aaa" class="axis-label">low</text>
<text x="580" y="436" text-anchor="middle" font-size="10" fill="#aaa" class="axis-label">high</text>
<text x="65"  y="424" text-anchor="middle" font-size="10" fill="#aaa" class="axis-label">low</text>
<text x="65"  y="56"  text-anchor="middle" font-size="10" fill="#aaa" class="axis-label">high</text>

<!--
  Gap positions (x=feasibility*500+80, y=420-urgency*370):
  Gap1 Adversarial:     urgency=0.95, feasibility=0.28 → x=220, y=68
  Gap2 XAI Benchmarks:  urgency=0.82, feasibility=0.70 → x=430, y=116
  Gap3 Fairness/Bias:   urgency=0.88, feasibility=0.58 → x=370, y=94
  Gap4 Generalization:  urgency=0.78, feasibility=0.72 → x=440, y=131
  Gap5 Multilingual:    urgency=0.55, feasibility=0.65 → x=405, y=217
-->

<!-- Gap 1: Adversarial robustness -->
<circle cx="220" cy="68" r="28" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5"/>
<text x="220" y="63" text-anchor="middle" font-size="10" font-weight="500" fill="#501313">Gap 1</text>
<text x="220" y="77" text-anchor="middle" font-size="9" fill="#791F1F">Adversarial</text>
<text x="220" y="88" text-anchor="middle" font-size="9" fill="#791F1F">robustness</text>

<!-- Gap 2: XAI Benchmarks -->
<circle cx="430" cy="116" r="28" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
<text x="430" y="111" text-anchor="middle" font-size="10" font-weight="500" fill="#173404">Gap 2</text>
<text x="430" y="125" text-anchor="middle" font-size="9" fill="#27500A">XAI eval</text>
<text x="430" y="136" text-anchor="middle" font-size="9" fill="#27500A">benchmarks</text>

<!-- Gap 3: Fairness/Bias -->
<circle cx="370" cy="94" r="28" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
<text x="370" y="89" text-anchor="middle" font-size="10" font-weight="500" fill="#173404">Gap 3</text>
<text x="370" y="103" text-anchor="middle" font-size="9" fill="#27500A">Fairness</text>
<text x="370" y="114" text-anchor="middle" font-size="9" fill="#27500A">and bias</text>

<!-- Gap 4: Generalization -->
<circle cx="450" cy="145" r="28" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
<text x="450" y="140" text-anchor="middle" font-size="10" font-weight="500" fill="#173404">Gap 4</text>
<text x="450" y="154" text-anchor="middle" font-size="9" fill="#27500A">Cross-domain</text>
<text x="450" y="165" text-anchor="middle" font-size="9" fill="#27500A">generalization</text>

<!-- Gap 5: Multilingual -->
<circle cx="410" cy="217" r="28" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
<text x="410" y="212" text-anchor="middle" font-size="10" font-weight="500" fill="#04342C">Gap 5</text>
<text x="410" y="226" text-anchor="middle" font-size="9" fill="#085041">Multilingual</text>
<text x="410" y="237" text-anchor="middle" font-size="9" fill="#085041">detection</text>

<!-- Timeline roadmap below matrix -->
<text x="340" y="450" text-anchor="middle" font-size="12" font-weight="500" fill="#1a1a1a" class="title-text">Suggested research timeline</text>

<!-- Timeline bar -->
<line x1="80" y1="476" x2="600" y2="476" stroke="#ccc" stroke-width="1.5"/>
<line x1="80"  y1="470" x2="80"  y2="482" stroke="#888" stroke-width="1"/>
<line x1="253" y1="470" x2="253" y2="482" stroke="#888" stroke-width="1"/>
<line x1="427" y1="470" x2="427" y2="482" stroke="#888" stroke-width="1"/>
<line x1="600" y1="470" x2="600" y2="482" stroke="#888" stroke-width="1"/>

<text x="80"  y="495" text-anchor="middle" font-size="10" fill="#666" class="axis-label">Now</text>
<text x="253" y="495" text-anchor="middle" font-size="10" fill="#666" class="axis-label">1–2 years</text>
<text x="427" y="495" text-anchor="middle" font-size="10" fill="#666" class="axis-label">3–4 years</text>
<text x="600" y="495" text-anchor="middle" font-size="10" fill="#666" class="axis-label">5+ years</text>

<!-- Milestone dots on timeline -->
<circle cx="140" cy="476" r="5" fill="#3B6D11"/>
<text x="140" y="467" text-anchor="middle" font-size="9" fill="#3B6D11">Gap 2, 3</text>

<circle cx="230" cy="476" r="5" fill="#0F6E56"/>
<text x="230" y="467" text-anchor="middle" font-size="9" fill="#0F6E56">Gap 4, 5</text>

<circle cx="360" cy="476" r="5" fill="#BA7517"/>
<text x="360" y="467" text-anchor="middle" font-size="9" fill="#BA7517">Gap 1 (partial)</text>

<circle cx="510" cy="476" r="5" fill="#A32D2D"/>
<text x="510" y="467" text-anchor="middle" font-size="9" fill="#A32D2D">Gap 1 (full solution)</text>

</svg>
</body>
</html>

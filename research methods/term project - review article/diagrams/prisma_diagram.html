<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PRISMA Flow Diagram</title>
<style>
  body { font-family: sans-serif; background: #fff; margin: 0; padding: 20px; }
  svg text { font-family: sans-serif; }
  .node { cursor: pointer; }
  .node:hover rect, .node:hover ellipse { opacity: 0.85; }
</style>
</head>
<body>
<svg width="100%" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Title -->
<text x="240" y="28" text-anchor="middle" font-size="14" font-weight="500" fill="#1a1a1a">PRISMA selection flow</text>

<!-- Phase divider line -->
<line x1="112" y1="48" x2="112" y2="590" stroke="#ccc" stroke-width="0.8" stroke-dasharray="4 3"/>

<!-- Phase labels -->
<text x="62" y="100" text-anchor="middle" font-size="12" fill="#666">Identify</text>
<text x="62" y="240" text-anchor="middle" font-size="12" fill="#666">Screen</text>
<text x="62" y="400" text-anchor="middle" font-size="12" fill="#666">Eligible</text>
<text x="62" y="540" text-anchor="middle" font-size="12" fill="#666">Include</text>

<!-- STAGE 1: Records identified -->
<g class="node">
  <rect x="122" y="70" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="242" y="91" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Records identified</text>
  <text x="242" y="109" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">n = 250 from 4 databases</text>
</g>

<!-- Arrow down -->
<line x1="242" y1="126" x2="242" y2="210" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- STAGE 2: Records screened -->
<g class="node">
  <rect x="122" y="210" width="240" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="242" y="231" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Records screened</text>
  <text x="242" y="249" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">n = 182 (duplicates removed)</text>
</g>

<!-- Arrow down -->
<line x1="242" y1="266" x2="242" y2="370" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- STAGE 3: Full-text assessed -->
<g class="node">
  <rect x="122" y="370" width="240" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="242" y="391" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Full-text assessed</text>
  <text x="242" y="409" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">n = 56</text>
</g>

<!-- Arrow down -->
<line x1="242" y1="426" x2="242" y2="510" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- STAGE 4: Studies included -->
<g class="node">
  <rect x="122" y="510" width="240" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="242" y="531" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#27500A">Studies included</text>
  <text x="242" y="549" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">n = 12</text>
</g>

<!-- RIGHT SIDE: Duplicates removed -->
<g class="node">
  <rect x="392" y="76" width="256" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="520" y="91" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Duplicates removed</text>
  <text x="520" y="109" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">n = 68</text>
</g>
<line x1="362" y1="98" x2="392" y2="98" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- RIGHT SIDE: Excluded at screening -->
<g class="node">
  <rect x="392" y="204" width="256" height="68" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="520" y="222" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Excluded n = 126</text>
  <text x="520" y="240" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">not AGTD · no XAI component</text>
  <text x="520" y="256" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">pre-2023 · outside scope</text>
</g>
<line x1="362" y1="238" x2="392" y2="238" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- RIGHT SIDE: Excluded at full-text -->
<g class="node">
  <rect x="392" y="346" width="256" height="104" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="520" y="364" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Excluded n = 44</text>
  <text x="520" y="381" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">no formal XAI method (n=18)</text>
  <text x="520" y="397" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">dataset &lt; 500 samples (n=12)</text>
  <text x="520" y="413" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">non-English text (n=8)</text>
  <text x="520" y="429" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">no standard eval metric (n=6)</text>
</g>
<line x1="362" y1="398" x2="392" y2="398" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Footer -->
<text x="242" y="596" text-anchor="middle" font-size="11" fill="#888">Google Scholar (120) · ArXiv (72) · IEEE Xplore (38) · SciSpace (20)</text>
</svg>
</body>
</html>
